sample:
  description: Custom out-of-tree AHT20 I2C temperature/humidity sensor driver (Zephyr sensor API)
  name: aht20_driver_example
common:
  tags:
    - i2c
    - sensor
tests:
  sample.sensor.aht20_driver_example:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Temperature: (.*) C, Humidity: (.*) %"
